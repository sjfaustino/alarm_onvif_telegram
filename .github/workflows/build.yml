name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32s3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Stub out secrets
        # secrets.h is gitignored (real credentials never live in the repo) -
        # the example template compiles fine on its own for a build-only check.
        # telegram_ca.h IS committed but ships with a placeholder certificate
        # string, which is also fine for compilation (only mbedtls cares at
        # runtime whether it's a real cert).
        run: cp include/secrets.h.example include/secrets.h

      - name: Build (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware artifact
        # firmware.bin is the plain app image - upload it via the running
        # board's own Firmware dashboard page (OTA, no USB needed).
        # firmware.factory.bin is the merged bootloader+partitions+app
        # image for a from-scratch flash (`esptool write_flash`) onto a
        # blank board. if-no-files-found:error catches a future PlatformIO/
        # path change that would otherwise silently upload an empty artifact.
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware.factory.bin
          if-no-files-found: error
          retention-days: 30
