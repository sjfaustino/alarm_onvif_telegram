; PlatformIO Project Configuration File
;
; Uses the pioarduino community fork of platform-espressif32
; (https://github.com/pioarduino/platform-espressif32) instead of the
; official `platform = espressif32`, for a more current Arduino-ESP32 core
; and IDF version. It's a drop-in replacement - same `pio` CLI, same board
; IDs, same build_flags - only the `platform =` line differs. Works with
; either the standard PlatformIO extension/CLI or the pioarduino VSCode
; extension (https://github.com/pioarduino/pioarduino-vscode-ide).
;
; Pinned to release 55.03.311 (Arduino core 3.3.11 / ESP-IDF 5.5.5) instead
; of the `stable` tag, so a new pioarduino release can't silently change
; what CI (or your own build) actually compiles against - `stable` always
; points at whatever's newest, so a build failure days or weeks from now
; could trace back to an upstream release, not anything changed here. To
; move to a newer release deliberately, pick a tag from
; https://github.com/pioarduino/platform-espressif32/releases and replace
; the version number in the URL below.
;
; PSRAM is a hard runtime requirement, not just a nice-to-have: a snapshot
; alert can go to multiple Telegram users, which means the full JPEG has to
; be buffered in RAM once and resent per recipient. main.cpp's setup()
; checks ESP.getPsramSize() and refuses to start (loops forever printing a
; warning) if it's 0. This project was also flashed to a couple of no-PSRAM
; boards earlier in development (a classic ESP32, an ESP32-S2) - those
; [env:...] sections have been removed now that PSRAM is mandatory; only a
; PSRAM-equipped board will actually run past boot.

[platformio]
default_envs = esp32s3

; Host-native unit tests (`pio test -e native`) - compiles and runs on this
; machine/CI runner directly, no ESP32 hardware involved. Only exercises the
; pure-logic modules (test/README.md explains which, and why the rest of
; the firmware can't be tested this way without real hardware or a lot more
; mocking than it's worth). Deliberately excluded from `default_envs` so a
; plain `pio run`/`-t upload` never tries to build it as firmware.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Iinclude
    ; Neither env enables -Wall (the ESP32 toolchain's own default flags
    ; don't either - verified, not assumed), so -Wswitch is otherwise
    ; silently off: a switch over an enum class missing a case compiles
    ; clean, no warning at all, regardless of how many "no default case on
    ; purpose, so a new enumerator fails to compile" comments claim
    ; otherwise (telegram_parse.h's TelegramCommand/TelegramCommandPermission
    ; switches rely on exactly this). -Werror=switch turns that into a hard
    ; build failure without needing -Wall's much noisier full warning set.
    -Werror=switch
lib_deps =
    fabiobatsilva/ArduinoFake@^0.4.0
    bblanchon/ArduinoJson@^7.4.3
test_framework = unity

[env:esp32s3]
; ESP32-S3 (QFN56), dual core + LP core, 8MB embedded PSRAM (AP_3v3).
; qio_opi is the memory_type for boards with 8MB *embedded octal* PSRAM
; (the common wiring for WROOM-1 N8R8-style S3 modules). If
; ESP.getPsramSize() logs 0 after flashing this env, your module likely
; wires PSRAM as quad instead of octal - try qio_qspi in that case.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    ; lib/* modules (e.g. camera_serialize, xml_helpers) reference headers
    ; that live in the project's top-level include/, not their own folder -
    ; PlatformIO's LDF doesn't add that path to a lib's own compile step
    ; automatically, so it's added explicitly here (env:native needs the
    ; same, and already has it).
    -Iinclude
    -Werror=switch ; see env:native's comment - same reasoning, both envs need it
lib_deps =
    hoeken/PsychicHttp
    bblanchon/ArduinoJson@^7.4.3
