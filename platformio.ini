; PlatformIO Project Configuration File
;
; Uses the pioarduino community fork of platform-espressif32
; (https://github.com/pioarduino/platform-espressif32) instead of the
; official `platform = espressif32`, for a more current Arduino-ESP32 core
; and IDF version. It's a drop-in replacement - same `pio` CLI, same board
; IDs, same build_flags - only the `platform =` line differs. Works with
; either the standard PlatformIO extension/CLI or the pioarduino VSCode
; extension (https://github.com/pioarduino/pioarduino-vscode-ide).
;
; `stable` always resolves to pioarduino's current stable release. For a
; reproducible/pinned build (recommended for CI or once your setup is
; working the way you want), replace `stable` in the URL below with a
; specific release tag from https://github.com/pioarduino/platform-espressif32/releases,
; e.g. .../releases/download/55.03.39/platform-espressif32.zip
;
; This project has been flashed to three boards over the course of
; development - see config.h's hardware note for the chip-id details on
; each. Rather than hand-edit `board =` every time you swap hardware, each
; confirmed board gets its own [env:...] section below; pick which to
; build/upload with `pio run -e <name> -t upload`, or change default_envs.
;
; The C++ source itself does NOT need per-board changes for PSRAM (that's
; a runtime check - see telegram.cpp) - only the build-time settings below
; differ (memory layout, PSRAM wiring type).

[platformio]
default_envs = esp32s3   ; currently-connected board; switch or override with -e

[env:esp32dev]
; Classic dual-core ESP32-D0WDQ6, Wi-Fi + BT, no PSRAM.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =

[env:esp32s3]
; ESP32-S3 (QFN56), dual core + LP core, 8MB embedded PSRAM (AP_3v3).
; qio_opi is the memory_type for boards with 8MB *embedded octal* PSRAM
; (the common wiring for WROOM-1 N8R8-style S3 modules). If
; ESP.getPsramSize() logs 0 after flashing this env, your module likely
; wires PSRAM as quad instead of octal - try qio_qspi in that case.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
lib_deps =

