; PlatformIO Project Configuration File
;
; Generated by pioarduino (pio project init --board featheresp32-s2), with
; our build_flags/lib_deps added. Under pioarduino, `platform = espressif32`
; resolves to their community fork automatically - no GitHub URL needed.
[env:esp32dev]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
