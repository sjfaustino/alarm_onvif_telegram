; Uses the pioarduino fork of platform-espressif32 for a newer Arduino core and
; IDF: https://github.com/pioarduino/platform-espressif32
;
; Pinned to release 55.03.311 (Arduino core 3.3.11 / ESP-IDF 5.5.5) rather than
; `stable`, so an upstream release can't change what gets built. To upgrade, put
; a newer release tag in the URL below.

[platformio]
default_envs = esp32s3

; Host-native unit tests (`pio test -e native`), covering test/ + lib/ only; see
; test/README.md. Not a default env, so `pio run` never builds it as firmware.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Iinclude
lib_deps =
    fabiobatsilva/ArduinoFake@^0.4.0
    bblanchon/ArduinoJson@^7.4.3
test_framework = unity

; ESP32-S3 with 8MB embedded PSRAM, which is mandatory: setup() halts without
; it. qio_opi suits octal PSRAM (e.g. WROOM-1 N8R8). If ESP.getPsramSize() logs
; 0 after flashing, try qio_qspi.
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:scripts/generate_build_version.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    ; lib/* modules include headers from the top-level include/.
    -Iinclude
; src/ only, so a non-exhaustive switch in the framework or a dependency can't
; fail the build. lib/telegram_parse/library.json covers that one lib module.
build_src_flags =
    -Werror=switch
lib_deps =
    hoeken/PsychicHttp
    bblanchon/ArduinoJson@^7.4.3
